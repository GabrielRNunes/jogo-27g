</pattern>
<linearGradient id="led" x1="0" x2="1"><stop offset="0" stop-color="#58b3b0"/><stop offset=".5" stop-color="#c35f86"/><stop offset="1" stop-color="#58b3b0"/></linearGradient>
<radialGradient id="vig" cx="50%" cy="48%" r="75%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".66"/></radialGradient>
<radialGradient id="luz" cx="50%" cy="38%" r="55%"><stop offset="0" stop-color="#ffe7b0" stop-opacity=".30"/><stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/></radialGradient>
</defs>
