  <rect x="-40" y="20" width="80" height="20" fill="#8a443f" stroke="#17110f" stroke-width="3"/>
  <rect x="40" y="20" width="80" height="20" fill="#a55a50" stroke="#17110f" stroke-width="3"/>
</pattern>
<pattern id="azulejo" width="40" height="40" patternUnits="userSpaceOnUse">
