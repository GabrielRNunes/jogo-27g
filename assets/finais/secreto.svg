="5" stroke-linejoin="round" stroke-linecap="round" /><text x="195.5" y="546" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#17110f" text-anchor="middle">O bilhete do Kairo</text><clipPath id="q11"><path d="M560 20 L1090 20 L1050 580 L520 580 Z"/></clipPath><g clip-path="url(#q11)"><rect x="520" y="20" width="570" height="560" fill="#26394a"/><rect x="520" y="20" width="570" height="560" fill="url(#pontos)" opacity=".28"/><rect x="600" y="130" width="400" height="160" rx="10" fill="#0d1a20" stroke="#17110f" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><text x="800" y="190" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#7be0a4" text-anchor="middle">APAGANDO</text><text x="800" y="240" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#7be0a4" text-anchor="middle">REGISTROS...</text><rect x="600" y="330" width="400" height="40" rx="10" fill="#0d0a14" stroke="#17110f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><rect x="606" y="336" width="388" height="28" rx="8" fill="#7be0a4" stroke="#17110f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="800" y="430" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="80" font-weight="800" fill="#7be0a4" text-anchor="middle">100%</text><g transform="rotate(-3 800 495)"><text x="800" y="495" font-family="Arial Black, Arial, sans-serif" font-size="50" font-weight="900" text-anchor="middle" fill="#ffd24a" stroke="#17110f" stroke-width="7" paint-order="stroke" stroke-linejoin="round">DELETE</text></g></g><path d="M560 20 L1090 20 L1050 580 L520 580 Z" fill="none" stroke="#17110f" stroke-width="10" stroke-linejoin="round"/><rect x="546" y="514" width="190.5" height="46" rx="0" fill="#f2dc8a" stroke="#17110f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="641.25" y="546" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#17110f" text-anchor="middle">Sem rastros</text><clipPath id="q12"><path d="M1110 20 L1580 20 L1580 580 L1070 580 Z"/></clipPath><g clip-path="url(#q12)"><rect x="1070" y="20" width="510" height="560" fill="#3d3a63"/><rect x="1070" y="20" width="510" height="560" fill="url(#pontos)" opacity=".28"/><circle cx="1400" cy="150" r="64" fill="#e6d5b8" stroke="#17110f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M1070 380 L1250 330 L1400 360 L1580 320 L1580 580 L1070 580 Z" fill="#1c1830" stroke="#17110f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M1240 580 L1310 420 L1350 420 L1440 580 Z" fill="#6a5a8c" stroke="#17110f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="1318" y="360" width="14" height="36" rx="0" fill="#0f0c18" stroke="#17110f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="1325" cy="352" r="11" fill="#0f0c18" stroke="#17110f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><g transform="rotate(0 1330 100)"><text x="1330" y="100" font-family="Arial Black, Arial, sans-serif" font-size="90" font-weight="900" text-anchor="middle" fill="#e6d5b8" stroke="#17110f" stroke-width="12" paint-order="stroke" stroke-linejoin="round">...</text></g></g><path d="M1110 20 L1580 20 L1580 580 L1070 580 Z" fill="none" stroke="#17110f" stroke-width="10" stroke-linejoin="round"/><rect x="1096" y="514" width="237.0" height="46" rx="0" fill="#f2dc8a" stroke="#17110f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="1214.5" y="546" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#17110f" text-anchor="middle">Ele quis sumir</text></g>
<rect width="1600" height="600" filter="url(#grao)" opacity=".45"/>
</svg>
